# -----------------------------
# MLflow Deployment
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/drai-inn/ai-gpu-mlflow:v0.4.0
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -x

              echo "Upgrading mlflow database..."
              mlflow db upgrade ${MLFLOW_BACKEND_STORE_URI}

              echo "Starting mlflow..."
              mlflow server --app-name oidc-auth --host 0.0.0.0 --port 5000 \
                  --artifacts-destination s3://drai-mlflow-test \
                  --serve-artifacts
          ports:
            - containerPort: 5000
          env:
            - name: OIDC_DISCOVERY_URL
              value: https://keycloak.test.drai.auckland.ac.nz/realms/drai/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mlflow-test
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_OIDC_CLIENT_SECRET
            - name: OIDC_PROVIDER_DISPLAY_NAME
              value: Login with DRAI Keycloak
            - name: OIDC_REDIRECT_URI
              value: https://mlflow.test.drai.auckland.ac.nz/callback
            - name: OIDC_SCOPE
              value: openid email profile
            # Group allowlists below must use Keycloak full group paths
            # (leading slash). The Group Membership mapper on the mlflow-test
            # client has Full group path = ON; without the slash these values
            # would not match and login would fail.
            - name: OIDC_GROUPS_ATTRIBUTE
              value: groups
            - name: OIDC_GROUP_NAME
              value: "/mlflow"
            - name: OIDC_ADMIN_GROUP_NAME
              value: "/mlflow-admin"
            - name: OIDC_USE_REFRESH_TOKEN
              value: "true"
            - name: OIDC_SESSION_EXPIRY_LEEWAY_SECONDS
              value: "30"
            - name: EXTEND_MLFLOW_REAUTH
              value: "true"
            - name: LOG_LEVEL
              value: INFO
            - name: DEFAULT_MLFLOW_PERMISSION
              value: NO_PERMISSIONS
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres-secret
                  key: password
            - name: MLFLOW_BACKEND_STORE_URI
              value: "postgresql+psycopg2://mlflow:$(DB_PASSWORD)@mlflow-postgres-postgresql.mlflow.svc.cluster.local:5432/mlflow"
            - name: OIDC_USERS_DB_URI
              value: "postgresql+psycopg2://mlflow:$(DB_PASSWORD)@mlflow-postgres-postgresql.mlflow.svc.cluster.local:5432/mlflow_auth"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_AWS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_AWS_SECRET_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              value: https://object.akl-1.cloud.nesi.org.nz
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_CALCULATION
              value: when_required
            - name: MLFLOW_CRYPTO_KEK_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_CRYPTO_KEK_PASSPHRASE
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_OIDC_SECRET_KEY
            # NOTE: setting MLFLOW_SERVER_ALLOWED_HOSTS REPLACES MLflow's built-in
            # loopback/private defaults (it is not additive). A public-host-only value
            # silently breaks MLflow's in-process job subsystem (e.g. GenAI "Detect
            # Issues" / built-in scorers), whose workers self-call the server over
            # loopback -> 403 "Invalid Host header (DNS rebinding)". Keep the public
            # host AND restore the loopback + RFC1918/ULA private patterns.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: mlflow.test.drai.auckland.ac.nz,localhost,127.0.0.1,[::1],0.0.0.0,localhost:*,127.0.0.1:*,0.0.0.0:*,10.*,172.*,192.168.*,fc00:*,fd00:*
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: https://mlflow.test.drai.auckland.ac.nz
            # Required for the in-process job workers (Detect Issues / built-in judges)
            # to authenticate their gateway self-calls back through the OIDC layer.
            # MLflow builds a Basic-auth header from these via read_mlflow_creds().
            # ACTION: create a DEDICATED service-account credential (NOT a personal
            # token) and store it in the mlflow-secret (or a new secret). Without these,
            # Detect Issues fails with {"detail":"Authentication required"}.
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_TRACKING_USERNAME
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_TRACKING_PASSWORD
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"

---
# -----------------------------
# ClusterIP Service
# -----------------------------
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
